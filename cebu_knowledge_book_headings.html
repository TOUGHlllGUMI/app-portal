<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セブ知識帳</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f4f0;
  color:#16181d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}
header{
  padding:34px 20px 22px;
  text-align:center;
  background:#f5f4f0;
}
h1{margin:0;font-size:28px}
.subtitle{margin:8px 0 0;color:#6f737b;font-size:14px}
main{max-width:760px;margin:0 auto;padding:10px 16px 40px}
.section-title{
  font-size:21px;
  margin:28px 4px 12px;
}
.section-title:first-child{margin-top:10px}
.card{
  background:#fff;
  border:1px solid #dedcd5;
  border-radius:16px;
  padding:20px;
  margin:0 0 14px;
  box-shadow:0 4px 14px rgba(20,20,20,.04);
}
.question{font-size:17px;font-weight:700;line-height:1.6}
.answer{
  display:none;
  margin-top:16px;
  padding:14px;
  background:#f7f8fb;
  border-left:3px solid #2f6fd0;
  border-radius:8px;
  line-height:1.7;
  font-size:14px;
}
button{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#2f6fd0;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
button:active{transform:scale(.99)}
button.open{background:#6f737b}
</style>
</head>
<body>
<header>
  <h1>🇵🇭 セブ知識帳</h1>
  <p class="subtitle">セブについて、ちょっと詳しくなろう。</p>
</header>
<main id="quizList"></main>

<script>
const quizzes = [
["セブの基本","セブ島はフィリピンのどのあたりにある？","フィリピン中部のビサヤ地方にあります。セブ島はマニラがあるルソン島より南に位置しています。"],
["セブの基本","セブの中心的な都市は？","セブシティです。セブ島の東側にあり、周辺のマクタン島などと合わせて大きな都市圏を形成しています。"],
["セブの基本","セブで使われる主な言語は？","英語とフィリピン語に加えて、現地ではセブアノ語（ビサヤ語）が広く使われています。"],
["セブの基本","フィリピンの通貨は？","フィリピン・ペソです。通貨記号は₱です。"],
["セブの基本","セブの気候はどんな感じ？","一年を通して暖かい熱帯性の気候です。日本のような四季ははっきりしていません。"],

["観光スポット","マゼランクロスとは？","セブシティにある歴史的な十字架で、1521年にマゼランがセブに到着したことに関連する場所として知られています。"],
["観光スポット","サント・ニーニョ教会とは？","セブシティにあるフィリピン最古級のキリスト教教会の一つです。サント・ニーニョ像が有名です。"],
["観光スポット","トップスとは？","セブシティ周辺の高台にある展望スポットで、セブの街や海を眺められる場所として知られています。"],
["観光スポット","モアルボアルで有名な海の生き物は？","大量のイワシが群れで泳ぐ『サーディンラン』が有名です。"],
["観光スポット","カワサン滝があるのは？","セブ島南西部のバディアン周辺です。青く見える水が特徴的な滝として有名です。"],

["食べ物","レチョンとは？","豚を丸焼きにしたフィリピン料理です。特別な日やお祝いの料理としても親しまれています。"],
["食べ物","シシグとは？","豚肉などを細かく刻み、玉ねぎなどと一緒に味付けして鉄板などで提供するフィリピン料理です。"],
["食べ物","マンゴーはセブで有名？","はい。セブは甘いマンゴーで有名で、ドライマンゴーも定番のお土産です。"],
["食べ物","ハロハロとは？","フィリピンの代表的な冷たいデザートです。果物、豆、ゼリー、アイスなど、さまざまな具材を混ぜて食べます。"],
["食べ物","パンデサルとは？","フィリピンで親しまれている小さなパンです。朝食や軽食などで食べられます。"],

["言葉","『こんにちは』に近いフィリピン語は？","『Magandang araw（マガンダン・アラウ）』が『こんにちは／良い一日を』に近い表現です。"],
["言葉","『ありがとう』はフィリピン語で？","『Salamat（サラマッ）』です。より丁寧に言う場合は『Salamat po』とします。"],
["言葉","『はい』はフィリピン語で？","『Oo（オーオー）』です。"],
["言葉","『いいえ』はフィリピン語で？","『Hindi（ヒンディ）』です。"],
["言葉","セブで英語は通じる？","英語は広く使われています。ホテル、観光地、飲食店などでは英語でやり取りできる場面が多いです。"],

["お金","フィリピン・ペソの略称は？","PHPです。日本円から両替するときなどに見かける表記です。"],
["お金","フィリピンでチップは必須？","日本のように一律で必須という文化ではありません。ただし、サービス料が含まれていない場合などに心付けを渡すことがあります。"],
["お金","セブでカードは使える？","ホテルや大型店などでは使えることが多いですが、小さな店やローカルな場所では現金が必要になる場合があります。"],
["お金","フィリピンの紙幣に描かれているものは？","歴代の人物やフィリピンの歴史・自然に関係する図柄などが使われています。"],
["お金","1ペソは日本円でいくら？","1フィリピン・ペソは約2.51円です。10ペソは約25円、100ペソは約251円、1,000ペソは約2,510円です。為替レートは毎日変動します。"],

["交通","セブの空港がある島は？","マクタン島です。正式名称はマクタン・セブ国際空港です。"],
["交通","セブでよく見かける小型の公共交通機関は？","ジープニーです。フィリピンを代表する乗り物の一つです。"],
["交通","セブのタクシーは使える？","はい。セブではタクシーや配車サービスなどが利用されています。"],
["交通","セブでは日本と同じ側を走る？","いいえ。フィリピンでは車は右側通行です。"],
["交通","マクタン島とセブ島はどうつながっている？","複数の橋でつながっています。"],

["文化・マナー","フィリピンでは家族を大切にする文化が強い？","はい。家族とのつながりを重視する文化が広く見られます。"],
["文化・マナー","フィリピンで英語が広く使われる理由の一つは？","歴史的な背景があり、教育や行政などで英語が広く使われてきたためです。"],
["文化・マナー","フィリピンでは笑顔で接する人が多い？","一般的に、明るく親しみやすいコミュニケーションが特徴の一つとされています。もちろん人によって違います。"],
["文化・マナー","教会を訪れるときの服装で気をつけることは？","宗教施設なので、露出が多すぎる服装は避け、周囲に配慮した服装を心がけると安心です。"],
["文化・マナー","フィリピンで『po』を付ける意味は？","相手への敬意を表すために使われる丁寧な表現です。"],

["歴史","マゼランがセブに到着したのは何年？","1521年です。マゼランの航海隊がセブに到着しました。"],
["歴史","フィリピンはかつてスペインの統治を受けていた？","はい。16世紀から長期間にわたりスペインの統治を受けました。"],
["歴史","セブはフィリピンの歴史で重要な場所？","はい。マゼランの到着や初期のキリスト教布教など、フィリピン史の重要な出来事と関係があります。"],
["歴史","フィリピンの独立記念日はいつ？","6月12日です。1898年6月12日にスペインからの独立を宣言したことに由来します。"],
["歴史","セブで有名な歴史的人物は？","ラプ＝ラプが有名です。マクタン島でスペイン側と戦った人物として知られています。"],

["自然","セブ周辺の海はきれい？","セブ周辺には美しい海やサンゴ礁があり、ダイビングやシュノーケリングが盛んな場所があります。"],
["自然","ジンベエザメで有名な町は？","セブ島南部のオスロブが有名です。"],
["自然","セブにはサンゴ礁がある？","はい。セブ周辺にはサンゴ礁があり、さまざまな海洋生物を見ることができます。"],
["自然","フィリピンは島国？","はい。多数の島からなる国で、フィリピンは世界有数の群島国家です。"],
["自然","セブ島は火山島？","セブ島は火山活動だけでできた島ではなく、複雑な地質を持つ島です。周辺には火山島もあります。"],

["セブ雑学","セブはフィリピンで何番目に大きな島？","面積ではフィリピンで大きい島の一つですが、ルソン島やミンダナオ島などより小さい島です。"],
["セブ雑学","セブの代表的なお土産は？","ドライマンゴー、マンゴーを使ったお菓子、フィリピンのお菓子などが定番です。"],
["セブ雑学","セブアノ語はセブだけで話されている？","いいえ。セブ島だけでなく、ビサヤ地方やミンダナオ島の一部などでも広く話されています。"],
["セブ雑学","フィリピンではカラオケが人気？","はい。フィリピンでは家庭や集まりなどで歌うことが非常に親しまれています。"],
["セブ雑学","セブでよく見かける『SM』とは？","フィリピンで大きく展開しているショッピングモールなどのブランドです。セブにも大型施設があります。"]
];

const list=document.getElementById("quizList");
let currentCategory="";

quizzes.forEach((q,i)=>{
  if(q[0] !== currentCategory){
    currentCategory=q[0];
    const heading=document.createElement("h2");
    heading.className="section-title";
    heading.textContent=currentCategory;
    list.appendChild(heading);
  }

  const card=document.createElement("section");
  card.className="card";
  card.innerHTML=`
    <div class="question">Q${i+1}. ${q[1]}</div>
    <button type="button">答えを見る</button>
    <div class="answer">${q[2]}</div>
  `;

  const btn=card.querySelector("button");
  const answer=card.querySelector(".answer");
  btn.addEventListener("click",()=>{
    const open=answer.style.display==="block";
    answer.style.display=open?"none":"block";
    btn.textContent=open?"答えを見る":"答えを隠す";
    btn.classList.toggle("open",!open);
  });

  list.appendChild(card);
});
</script>
</body>
</html>
