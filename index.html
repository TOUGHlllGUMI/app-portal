<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #dcdde2;
    --bg-1: #f4f4f8;
    --card: #14151f;
    --card-border: rgba(255,255,255,0.08);
    --text-0: #14151f;
    --text-1: #6a6c7c;
    --card-text-0: #f2f2f6;
    --card-text-1: #a6a8b8;
    --accent: #7c8cff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,140,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(224,122,95,0.14), transparent 45%),
      var(--bg-0);
    color: var(--text-0);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(2rem, 6vw, 4.5rem) 1.25rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: clamp(2.5rem, 6vw, 4rem);
  }

  h1 {
    margin: 0 0 0.6rem;
    font-weight: 900;
    font-size: clamp(2.4rem, 7vw, 4rem);
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--text-1);
    font-size: clamp(1.05rem, 2.5vw, 1.35rem);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(1.25rem, 3vw, 2.25rem);
    width: 100%;
    max-width: 1120px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: var(--card-text-0);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    padding: 2.75rem 2rem 2.25rem;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent-border, rgba(255,255,255,0.2));
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }

  .icon {
    width: 128px;
    height: 128px;
    border-radius: 28px;
    object-fit: cover;
    margin-bottom: 1.4rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }

  .card h2 {
    margin: 0 0 0.5rem;
    font-size: clamp(1.35rem, 3vw, 1.6rem);
    font-weight: 700;
  }

  .card p {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--card-text-1);
    line-height: 1.6;
  }

  .card[data-accent="kiricut"]:hover { --accent-border: rgba(120,140,255,0.45); }
  .card[data-accent="pomodoro"]:hover { --accent-border: rgba(224,122,95,0.45); }
  .card[data-accent="calculator"]:hover { --accent-border: rgba(150,110,230,0.45); }

  footer {
    margin-top: clamp(2.5rem, 6vw, 4rem);
    color: var(--text-1);
    font-size: 0.8rem;
    text-align: center;
  }

  footer a {
    color: var(--text-1);
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 3rem;
    }

    header p {
      font-size: 1.15rem;
    }

    .grid {
      grid-template-columns: 1fr;
    }

    .card {
      padding: 3rem 2rem;
    }

    .icon {
      width: 160px;
      height: 160px;
      border-radius: 34px;
      margin-bottom: 1.6rem;
    }

    .card h2 {
      font-size: 1.7rem;
    }

    .card p {
      font-size: 1.15rem;
    }
  }
</style>
</head>
<body>

<header>
  <h1>My Apps</h1>
  <p>これまで作ったアプリ一覧</p>
</header>

<main class="grid">
  <a class="card" data-accent="kiricut" href="https://toughlllgumi.github.io/Kiricut/" target="_blank" rel="noopener">
    <img class="icon" src="icons/kiricut.png" alt="Kiricut アイコン">
    <h2>Kiricut</h2>
    <p>写真の背景をブラウザだけで自動削除・差し替え</p>
  </a>

  <a class="card" data-accent="pomodoro" href="https://toughlllgumi.github.io/pomodoro-timer/" target="_blank" rel="noopener">
    <img class="icon" src="icons/pomodoro.png" alt="Noclock アイコン">
    <h2>Noclock</h2>
    <p>集中を続けるためのポモドーロタイマー</p>
  </a>

  <a class="card" data-accent="calculator" href="https://toughlllgumi.github.io/python-calculator-practice/" target="_blank" rel="noopener">
    <img class="icon" src="icons/calculator.png" alt="veta アイコン">
    <h2>veta(計算機)</h2>
    <p>シンプルなボタン式の電卓アプリ</p>
  </a>
</main>

<footer>
  <a href="https://github.com/TOUGHlllGUMI" target="_blank" rel="noopener">github.com/TOUGHlllGUMI</a>
</footer>

</body>
</html>
