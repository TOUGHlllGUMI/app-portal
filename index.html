<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080f;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text-0: #f5f5f9;
    --text-1: #9294a8;
    --eyebrow: #8b8dff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background:
      radial-gradient(ellipse 800px 500px at 12% -5%, rgba(139,141,255,0.22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(255,122,170,0.14), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 110%, rgba(90,200,255,0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text-0);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(3rem, 8vw, 6rem) 1.25rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: clamp(3rem, 7vw, 4.5rem);
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--eyebrow);
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 0.7rem;
    font-weight: 900;
    font-size: clamp(2.4rem, 7vw, 4rem);
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, #6A5CFF 0%, #A83AFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 0;
    color: var(--text-1);
    font-size: clamp(1rem, 2.3vw, 1.2rem);
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(1.25rem, 3vw, 2rem);
    width: 100%;
    max-width: 1080px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: var(--text-0);
    background: var(--card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 3rem 2rem 2.25rem;
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s ease;
    background: radial-gradient(circle at 50% 0%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-8px);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 20px 45px rgba(0,0,0,0.45);
  }

  .card:hover::before, .card:focus-visible::before {
    opacity: 1;
  }

  .card[data-accent="kiricut"] { --glow: rgba(90,140,255,0.35); }
  .card[data-accent="pomodoro"] { --glow: rgba(255,120,90,0.32); }
  .card[data-accent="calculator"] { --glow: rgba(180,110,255,0.32); }

  .icon {
    position: relative;
    width: 104px;
    height: 104px;
    border-radius: 26px;
    object-fit: cover;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.35s ease;
  }

  .card:hover .icon {
    transform: scale(1.05);
  }

  .card h2 {
    position: relative;
    margin: 0 0 0.55rem;
    font-size: clamp(1.25rem, 2.6vw, 1.5rem);
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .card p {
    position: relative;
    margin: 0;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--text-1);
    line-height: 1.65;
  }

  footer {
    margin-top: clamp(3rem, 7vw, 4.5rem);
    color: var(--text-1);
    font-size: 0.82rem;
    text-align: center;
  }

  footer a {
    color: var(--text-1);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  footer a:hover {
    color: var(--text-0);
    border-color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Portfolio</span>
  <h1>My Apps</h1>
  <p>これまで作ったアプリ一覧</p>
</header>

<main class="grid">
  <a class="card" data-accent="kiricut" href="https://toughlllgumi.github.io/Kiricut/" target="_blank" rel="noopener">
    <img class="icon" src="icons/kiricut.png" alt="Kiricut アイコン">
    <h2>Kiricut</h2>
    <p>写真の背景をブラウザだけで自動削除・差し替え。</p>
  </a>

  <a class="card" data-accent="pomodoro" href="https://toughlllgumi.github.io/pomodoro-timer/" target="_blank" rel="noopener">
    <img class="icon" src="icons/pomodoro.png" alt="Noclock アイコン">
    <h2>Noclock</h2>
    <p>集中を続けるためのポモドーロタイマー。</p>
  </a>

  <a class="card" data-accent="calculator" href="https://toughlllgumi.github.io/python-calculator-practice/" target="_blank" rel="noopener">
    <img class="icon" src="icons/calculator.png" alt="veta アイコン">
    <h2>veta</h2>
    <p>シンプルなボタン式の電卓アプリ。</p>
  </a>
</main>

<footer>
  <a href="https://github.com/TOUGHlllGUMI" target="_blank" rel="noopener">github.com/TOUGHlllGUMI</a>
</footer>

</body>
</html>
